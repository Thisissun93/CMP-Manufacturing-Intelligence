name: Verify
on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run build
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: independent reference values are up to date (pandas, scipy, statsmodels)
        run: |
          pip install pandas numpy scipy statsmodels
          python work/reference/compute_reference.py --check
